name: Deploy Storage Showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "showcase/**"
      - "package.json"
      - "package-lock.json"
      - "angular.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install library dependencies
        run: npm ci
      - name: Build storage library
        run: npm run build
      - name: Install Showcase dependencies
        run: npm ci --prefix showcase
      - name: Build Showcase
        run: npm run build --prefix showcase -- --base-href /Proyect-Storage/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/dist/storage-manager-showcase/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
